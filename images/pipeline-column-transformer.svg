<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    Pipeline de prétraitement (ColumnTransformer)
  </text>

  <!-- Données brutes -->
  <rect x="20" y="170" width="130" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="85" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Données</text>
  <text x="85" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">brutes</text>
  <text x="85" y="232" text-anchor="middle" font-size="10" fill="#64748b">(X_train)</text>

  <!-- Flèches vers deux branches -->
  <path d="M150,190 Q210,90 270,90" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M150,220 Q210,320 270,320" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Branche numérique -->
  <text x="410" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Colonnes numériques</text>
  <rect x="270" y="70" width="150" height="45" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="97" text-anchor="middle" font-size="11.5" fill="#1e3a8a">SimpleImputer</text>
  <path d="M420,92 L460,92" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="460" y="70" width="150" height="45" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="535" y="97" text-anchor="middle" font-size="11.5" fill="#1e3a8a">StandardScaler</text>

  <!-- Branche catégorielle -->
  <text x="410" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Colonnes catégorielles</text>
  <rect x="270" y="300" width="150" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345" y="327" text-anchor="middle" font-size="11.5" fill="#92400e">SimpleImputer</text>
  <path d="M420,322 L460,322" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="460" y="300" width="150" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="535" y="322" text-anchor="middle" font-size="11.5" fill="#92400e">OneHotEncoder</text>

  <!-- Fusion -->
  <path d="M610,92 Q680,92 680,200" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M610,322 Q680,322 680,220" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="650" y="170" width="140" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="720" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Matrice</text>
  <text x="720" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">prétraitée</text>
  <text x="720" y="230" text-anchor="middle" font-size="10" fill="#3730a3">→ modèle</text>

  <text x="410" y="390" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">
    .fit() est appelé uniquement sur X_train — .transform() est ensuite réappliqué tel quel à X_val / X_test
  </text>
</svg>
