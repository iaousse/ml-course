<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="260" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    Séparation du jeu de données
  </text>

  <!-- Barre complète -->
  <text x="380" y="65" text-anchor="middle" font-size="12.5" fill="#475569">Jeu de données complet (100 %)</text>
  <rect x="60" y="75" width="640" height="45" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Flèche vers séparation -->
  <line x1="380" y1="128" x2="380" y2="150" stroke="#334155" stroke-width="1.5"/>
  <polygon points="374,148 386,148 380,158" fill="#334155"/>

  <!-- Train -->
  <rect x="60" y="165" width="384" height="55" rx="4" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="252" y="188" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Entraînement (Train)</text>
  <text x="252" y="205" text-anchor="middle" font-size="11" fill="#312e81">≈ 60 %</text>

  <!-- Validation -->
  <rect x="444" y="165" width="128" height="55" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="508" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Validation</text>
  <text x="508" y="205" text-anchor="middle" font-size="11" fill="#92400e">≈ 20 %</text>

  <!-- Test -->
  <rect x="572" y="165" width="128" height="55" rx="4" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="636" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Test</text>
  <text x="636" y="205" text-anchor="middle" font-size="11" fill="#7f1d1d">≈ 20 %</text>

  <text x="252" y="245" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">Ajuste les paramètres</text>
  <text x="508" y="245" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">Règle les hyperparamètres</text>
  <text x="636" y="245" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">Évalue une seule fois</text>
</svg>
