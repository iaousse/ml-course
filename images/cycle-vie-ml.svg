<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="700" fill="#ffffff"/>

  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">
    Cycle de vie d'un projet Machine Learning
  </text>

  <!-- cercle guide -->
  <circle cx="350" cy="380" r="230" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,5"/>

  <!-- Etapes positionnées autour du cercle (7 étapes) -->
  <!-- Angles: -90, -38.6, 12.9, 64.3, 115.7, 167.1, -141.4 (7 steps, 360/7≈51.4) -->

  <!-- 1. Cadrage du problème -->
  <g>
    <circle cx="350" cy="150" r="62" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.2"/>
    <text x="350" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">1. Cadrage</text>
    <text x="350" y="160" text-anchor="middle" font-size="10.5" fill="#3730a3">du problème</text>
  </g>

  <!-- 2. Collecte des données -->
  <g>
    <circle cx="547" cy="230" r="62" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
    <text x="547" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">2. Collecte</text>
    <text x="547" y="240" text-anchor="middle" font-size="10.5" fill="#1e3a8a">des données</text>
  </g>

  <!-- 3. Préparation / nettoyage -->
  <g>
    <circle cx="580" cy="440" r="62" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
    <text x="580" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">3. Préparation</text>
    <text x="580" y="445" text-anchor="middle" font-size="10.5" fill="#1e3a8a">/ nettoyage</text>
    <text x="580" y="459" text-anchor="middle" font-size="10.5" fill="#1e3a8a">des données</text>
  </g>

  <!-- 4. Choix & entraînement modèle -->
  <g>
    <circle cx="420" cy="600" r="62" fill="#c7d2fe" stroke="#4338ca" stroke-width="2.2"/>
    <text x="420" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">4. Choix &amp;</text>
    <text x="420" y="605" text-anchor="middle" font-size="10.5" fill="#312e81">entraînement</text>
    <text x="420" y="619" text-anchor="middle" font-size="10.5" fill="#312e81">du modèle</text>
  </g>

  <!-- 5. Évaluation -->
  <g>
    <circle cx="230" cy="600" r="62" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
    <text x="230" y="595" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">5. Évaluation</text>
    <text x="230" y="610" text-anchor="middle" font-size="10.5" fill="#92400e">du modèle</text>
  </g>

  <!-- 6. Déploiement -->
  <g>
    <circle cx="120" cy="440" r="62" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
    <text x="120" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">6. Déploiement</text>
    <text x="120" y="450" text-anchor="middle" font-size="10.5" fill="#14532d">en production</text>
  </g>

  <!-- 7. Monitoring / maintenance -->
  <g>
    <circle cx="153" cy="230" r="62" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
    <text x="153" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">7. Suivi &amp;</text>
    <text x="153" y="235" text-anchor="middle" font-size="10.5" fill="#14532d">maintenance</text>
    <text x="153" y="249" text-anchor="middle" font-size="10.5" fill="#14532d">(monitoring)</text>
  </g>

  <!-- Flèches (approximation de flux circulaire) -->
  <path d="M405,165 Q480,175 512,200" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M568,290 Q580,360 577,378" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M545,494 Q495,545 470,565" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M361,610 Q300,615 288,610" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M180,563 Q140,515 128,499" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M117,378 Q125,320 133,290" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M197,192 Q265,163 289,155" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>

  <!-- retour de 5 vers 3 (boucle d'itération courte) -->
  <path d="M255,548 Q380,460 525,470" stroke="#dc2626" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <text x="390" y="500" text-anchor="middle" font-size="10.5" fill="#dc2626" font-style="italic">itération si performance insuffisante</text>

  <text x="350" y="388" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">processus</text>
  <text x="350" y="402" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">itératif</text>
</svg>
