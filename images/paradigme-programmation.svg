<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>

  <!-- Colonne gauche : programmation classique -->
  <text x="205" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
    Programmation classique
  </text>

  <rect x="55" y="80" width="150" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="130" y="112" text-anchor="middle" font-size="13" fill="#1e293b">Données</text>

  <rect x="55" y="170" width="150" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="130" y="202" text-anchor="middle" font-size="13" fill="#1e293b">Règles / Programme</text>
  <text x="130" y="216" text-anchor="middle" font-size="10" fill="#64748b">(écrit par l'humain)</text>

  <rect x="55" y="290" width="150" height="55" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="130" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Résultats</text>

  <path d="M130,135 L130,168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M130,225 L130,288" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Colonne droite : Machine Learning -->
  <text x="615" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">
    Machine Learning (Data-Driven)
  </text>

  <rect x="465" y="80" width="150" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="112" text-anchor="middle" font-size="13" fill="#1e3a8a">Données</text>

  <rect x="655" y="80" width="150" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="112" text-anchor="middle" font-size="13" fill="#1e3a8a">Résultats attendus</text>
  <text x="730" y="126" text-anchor="middle" font-size="10" fill="#1e40af">(exemples, étiquettes)</text>

  <rect x="540" y="170" width="150" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="615" y="202" text-anchor="middle" font-size="13" fill="#1e293b">Algorithme</text>
  <text x="615" y="216" text-anchor="middle" font-size="10" fill="#64748b">d'apprentissage</text>

  <rect x="540" y="290" width="150" height="55" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="615" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Modèle</text>
  <text x="615" y="330" text-anchor="middle" font-size="10" fill="#3730a3">(programme appris)</text>

  <path d="M555,135 L600,168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M715,135 L640,168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M615,225 L615,288" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Flèche verticale symbolisant l'inversion du flux -->
  <line x1="240" y1="290" x2="440" y2="290" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="340" y="278" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">le rôle de "Résultats"</text>
  <text x="340" y="368" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">et de "Programme" s'inversent</text>
</svg>
