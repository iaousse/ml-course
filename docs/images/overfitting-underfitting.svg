<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    Erreur en fonction de la complexité du modèle
  </text>

  <!-- Axes -->
  <line x1="90" y1="380" x2="700" y2="380" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="380" x2="90" y2="60" stroke="#334155" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" font-size="13" fill="#334155">Complexité du modèle →</text>
  <text x="55" y="220" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 55 220)">Erreur ↑</text>

  <!-- Courbe erreur d'entraînement (descend continuellement) -->
  <path d="M110,340 C 250,240 400,120 680,80" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="560" y="70" font-size="12.5" fill="#1d4ed8" font-weight="700">Erreur d'entraînement</text>

  <!-- Courbe erreur de validation (en U) -->
  <path d="M110,360 C 250,200 340,140 400,140 C 480,140 560,220 680,340" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="470" y="360" font-size="12.5" fill="#b91c1c" font-weight="700">Erreur de validation</text>

  <!-- Zone optimale -->
  <line x1="400" y1="60" x2="400" y2="380" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#166534" font-weight="700">Point optimal</text>

  <!-- Zones -->
  <text x="190" y="410" text-anchor="middle" font-size="13" fill="#92400e" font-weight="700">Sous-apprentissage</text>
  <text x="190" y="425" text-anchor="middle" font-size="10.5" fill="#92400e">(modèle trop simple)</text>

  <text x="400" y="440" text-anchor="middle" font-size="13" fill="#166534" font-weight="700">Ajustement optimal</text>

  <text x="600" y="410" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">Sur-apprentissage</text>
  <text x="600" y="425" text-anchor="middle" font-size="10.5" fill="#991b1b">(modèle trop complexe)</text>

  <!-- Zones ombrées -->
  <rect x="90" y="60" width="140" height="320" fill="#fef3c7" opacity="0.25"/>
  <rect x="500" y="60" width="200" height="320" fill="#fee2e2" opacity="0.25"/>
</svg>
