<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>

  <!-- Titre -->
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">
    Où se situe le Machine Learning ?
  </text>

  <!-- Cercle IA -->
  <circle cx="380" cy="290" r="220" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <!-- Cercle ML -->
  <circle cx="380" cy="320" r="155" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- Cercle DL -->
  <circle cx="380" cy="355" r="85" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="380" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#4338ca">
    Intelligence Artificielle (IA)
  </text>
  <text x="380" y="132" text-anchor="middle" font-size="12.5" fill="#4338ca">
    Systèmes capables d'imiter des comportements intelligents
  </text>

  <text x="380" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">
    Machine Learning (ML)
  </text>
  <text x="380" y="220" text-anchor="middle" font-size="12" fill="#1e40af">
    Apprentissage à partir de données,
  </text>
  <text x="380" y="235" text-anchor="middle" font-size="12" fill="#1e40af">
    sans règles explicites codées à la main
  </text>

  <text x="380" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">
    Deep
  </text>
  <text x="380" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">
    Learning
  </text>
  <text x="380" y="385" text-anchor="middle" font-size="10.5" fill="#1e3a8a">
    (réseaux de neurones
  </text>
  <text x="380" y="398" text-anchor="middle" font-size="10.5" fill="#1e3a8a">
    profonds)
  </text>

  <!-- Exemples IA hors ML -->
  <text x="175" y="480" text-anchor="middle" font-size="11.5" fill="#4b5563" font-style="italic">
    Ex. hors ML : systèmes experts,
  </text>
  <text x="175" y="495" text-anchor="middle" font-size="11.5" fill="#4b5563" font-style="italic">
    moteurs à règles logiques
  </text>

  <text x="595" y="480" text-anchor="middle" font-size="11.5" fill="#4b5563" font-style="italic">
    Ex. ML hors DL : régression,
  </text>
  <text x="595" y="495" text-anchor="middle" font-size="11.5" fill="#4b5563" font-style="italic">
    arbres de décision, k-NN
  </text>
</svg>
